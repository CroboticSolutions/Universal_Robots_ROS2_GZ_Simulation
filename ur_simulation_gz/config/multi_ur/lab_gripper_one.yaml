# Jedan UR5e s Robotiq 2F-85 na laboratorijskom stolu (isti layout kao prvi robot u lab_gripper.yaml).
# Bez Gazebo RGB-D kamere na robotu: ostavi prazno ili izbaci ključ (vidi lab_gripper.yaml za [ur1, ur2]).
camera_gz_robots: []
ur_type: ur5e
semantic_description_file: srdf/ur_robotiq.srdf.xacro
gazebo_gui: "true"
world_file: lab_table_one.sdf
gz_world_name: lab_table_coke
robot_namespace_prefix: ur
launch_rviz_first_robot: "true"
launch_servo: "false"
publish_robot_description_semantic: "true"
use_robotiq_gripper: "true"
robot_positions:
  - x: 0.2
    y: -0.1
    z: 1.0
    yaw: 1.57

# Add Gazebo lab_table tabletop as a MoveIt collision box (matches model://Table in lab_table_one.sdf).
publish_moveit_table_collision: "true"
moveit_table_collision_extra_delay_s: 12.0
