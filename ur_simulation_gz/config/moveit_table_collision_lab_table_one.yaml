# Table top_plate: same geometry as models/Table/model.sdf + lab_table pose (1, -0.55, 0) in lab_table_one.sdf.
# Collision frame has yaw -90° in tabletop link; center in world ≈ (0.2, 0.55, 0.93).
# Quaternion = Rz(-90°): z = -√2/2, w = √2/2. Dimensions along that collision frame (2.2 x 0.9 x 0.1).
frame_id: world
collision_object_id: lab_table_top_plate
position: {x: 0.2, y: 0.55, z: 0.93}
orientation: {x: 0.0, y: 0.0, z: -0.7071067811865476, w: 0.7071067811865476}
dimensions: [2.2, 0.9, 0.1]
# RViz MotionPlanning Scene Geometry (optional; default is green)
color: {r: 0.2, g: 0.85, b: 0.25, a: 0.75}

# Black platform: must match lab_table_one.sdf grasp_cube_platform (pose rpy 0 → identity).
extra_collision_objects:
  - collision_object_id: grasp_cube_platform
    frame_id: world
    position: {x: 0.2, y: 0.55, z: 1.08}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
    dimensions: [0.9, 0.5, 0.2]
    color: {r: 0.15, g: 0.15, b: 0.15, a: 0.95}
