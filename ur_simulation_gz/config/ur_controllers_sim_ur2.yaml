# Minimal controller config for dual-arm simulation (ur2).
# Excludes io_and_status, speed_scaling which may fail in sim.
/**/controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController


/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur2_shoulder_pan_joint
      - ur2_shoulder_lift_joint
      - ur2_elbow_joint
      - ur2_wrist_1_joint
      - ur2_wrist_2_joint
      - ur2_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur2_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }


/**/scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur2_shoulder_pan_joint
      - ur2_shoulder_lift_joint
      - ur2_elbow_joint
      - ur2_wrist_1_joint
      - ur2_wrist_2_joint
      - ur2_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur2_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur2_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

/**/forward_velocity_controller:
  ros__parameters:
    joints:
      - ur2_shoulder_pan_joint
      - ur2_shoulder_lift_joint
      - ur2_elbow_joint
      - ur2_wrist_1_joint
      - ur2_wrist_2_joint
      - ur2_wrist_3_joint
    interface_name: velocity

/**/forward_position_controller:
  ros__parameters:
    joints:
      - ur2_shoulder_pan_joint
      - ur2_shoulder_lift_joint
      - ur2_elbow_joint
      - ur2_wrist_1_joint
      - ur2_wrist_2_joint
      - ur2_wrist_3_joint
